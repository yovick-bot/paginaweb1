<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Proyecto Cloud | GDG Ayacucho</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #0f172a;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .status-box {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-blue);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: var(--accent-blue);
      transition: all 0.3s ease;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="badge">🚀 En vivo en la Nube</span>
    <h1>¡Hola desde Firebase!</h1>
    <p>Este es mi primer proyecto desplegado automáticamente desde <strong>GitHub</strong> usando <strong>Firebase Hosting</strong> en el workshop de GDG Ayacucho.</p>
    
    <div class="status-box" id="status">
      🟢 Sitio web en producción
    </div>

    <button class="btn" onclick="celebrar()">¡Celebrar Despliegue!</button>

    <footer>
      Desarrollado durante el Workshop GDG • 2026
    </footer>
  </main>

  <script>
    function celebrar() {
      const status = document.getElementById('status');
      status.innerHTML = '🎉 ¡Despliegue Exitoso a la Nube!';
      status.style.borderColor = '#c084fc';
      status.style.color = '#c084fc';
      status.style.backgroundColor = 'rgba(192, 132, 252, 0.1)';
    }
  </script>
</body>
</html>
